[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms_toolbox"
dynamic = ["version"]
description = "MolSuite Toolbox: applications, projects and shared settings."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ms_components[projects]>=0.5.3,<0.6",
    "ms_flow>=0.8.0,<0.9",
    "ms_env>=0.4.0,<0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[project.gui-scripts]
ms-toolbox = "ms_toolbox.app:main"

[project.urls]
Homepage = "https://github.com/MolSuite/ms_toolbox"
Issues = "https://github.com/MolSuite/ms_toolbox/issues"

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ms_toolbox = ["catalog/*.toml", "resources/*.desktop", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
