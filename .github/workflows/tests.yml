name: Tests and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # The runner's Azure apt mirror stops resolving at times: fall back to the main archive.
      - run: |
          install() { sudo timeout 180 apt-get update && sudo timeout 180 apt-get install -y libegl1 libopengl0; }
          install || { echo http://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt; install; }
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: molsuite-distributions
          path: dist/*
